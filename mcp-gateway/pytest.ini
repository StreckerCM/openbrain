[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto

# FastMCP's settings model emits this at import time from pydantic-settings.
# It comes from the dependency, not from this codebase, and there is nothing
# to fix here — filtered so a real warning stands out instead of being lost
# in known noise.
filterwarnings =
    ignore::UserWarning:pydantic_settings.sources.utils
