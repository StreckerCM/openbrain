services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openbrain}
      POSTGRES_USER: ${POSTGRES_USER:-openbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${PRIVATE_BIND:-127.0.0.1}:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openbrain}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:latest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgresql://${POSTGRES_USER:-openbrain}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-openbrain}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER:-openbrain}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?Set PGRST_JWT_SECRET in .env}
      PGRST_DB_CHANNEL_ENABLED: "true"
      PGRST_SERVER_PORT: 3000
    ports:
      - "${PRIVATE_BIND:-127.0.0.1}:3006:3000"
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "${PRIVATE_BIND:-127.0.0.1}:3008:8080"
    depends_on:
      db:
        condition: service_healthy

  mcp-gateway:
    build: ./mcp-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-openbrain}
      DB_USER: ${POSTGRES_USER:-openbrain}
      DB_PASS: ${POSTGRES_PASSWORD:?err}
      ORPHAN_POLICY: ${ORPHAN_POLICY:-archive}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./init.sql:/app/init.sql:ro
    ports:
      # Only the MCP listener is published. The write REST API on container
      # port 3002 is deliberately NOT published: its sole consumer is web-ui,
      # which reaches mcp-gateway:3002 over the internal docker network. Not
      # publishing it means nothing outside this host can route to it at all —
      # a network boundary rather than a proxy rule.
      - "${PRIVATE_BIND:-127.0.0.1}:3007:3001"
    depends_on:
      db:
        condition: service_healthy

  embedder:
    build: ./embedder
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-openbrain}
      DB_USER: ${POSTGRES_USER:-openbrain}
      DB_PASS: ${POSTGRES_PASSWORD:?err}
      POLL_INTERVAL: "30"
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy

  web-ui:
    build: ./web-ui
    restart: unless-stopped
    ports:
      - "${PRIVATE_BIND:-127.0.0.1}:3010:80"
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      - postgrest
      - mcp-gateway

  docs:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - ./docs-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PRIVATE_BIND:-127.0.0.1}:3009:80"

volumes:
  pgdata:

