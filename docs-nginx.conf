server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # ./docs is markdown-only with no index.html, so a bare directory
    # request would otherwise 403 ("directory index ... is forbidden").
    # Serve a browsable listing instead.
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }

    # nginx's mime.types maps .md to text/markdown, which browsers
    # download rather than display. Override just this extension so docs
    # are readable in-browser. A regex location is used so the rest of
    # the MIME map stays intact.
    location ~ \.md$ {
        default_type text/plain;
    }
}
